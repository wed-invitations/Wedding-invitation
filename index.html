<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#26090d">
    <title>Sumaiya Fatima & Arshad Khan</title>
    <style>
        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth;
            scroll-snap-type: y proximity;
            background: #170508
        }

        body {
            margin: 0;
            background: #170508;
            color: #f5dfae;
            font-family: Georgia, serif
        }

        .opening {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 28px;
            background: radial-gradient(ellipse at center, #3b1118 0%, #2b0b10 58%, #1b0609 100%);
            transition: opacity .8s ease, visibility .8s ease
        }

        .opening:before {
            content: '';
            position: absolute;
            inset: 14px;
            border: 1px solid rgba(214, 173, 98, .55);
            border-radius: 18px;
            pointer-events: none
        }

        .opening-inner {
            max-width: 850px;
            position: relative
        }

        .opening .eyebrow {
            font: 11px Arial, sans-serif;
            letter-spacing: .2em;
            color: #d6ad62;
            text-transform: uppercase;
            margin-bottom: 24px
        }

        .opening h1 {
            font: 300 clamp(48px, 9vw, 80px)/1.02 Georgia, serif;
            letter-spacing: -.055em;
            color: #f5dfae;
            line-height: 70px;
            margin: 0 0 22px
        }

        .opening .date {
            font-weight: bold;
            font: 24px Arial, sans-serif;
            letter-spacing: .18em;
            color: #f5dfae;
            text-transform: uppercase;
            margin: 28px 0 38px
        }

        .open-btn {
            border: 1px solid #d6ad62;
            background: transparent;
            color: #f5dfae;
            padding: 15px 30px;
            font: 11px Arial, sans-serif;
            letter-spacing: .2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background .25s, color .25s
        }

        .open-btn:hover {
            background: #d6ad62;
            color: #26090d
        }

        .opening.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none
        }

        .nav {
            position: fixed;
            z-index: 5;
            top: 0;
            left: 0;
            right: 0;
            padding: 18px 5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(#190609dd, transparent);
            font: 11px Arial, sans-serif;
            letter-spacing: .15em;
            text-transform: uppercase
        }

        .nav a {
            color: #d6ad62;
            text-decoration: none;
            margin-left: 22px
        }

        .brand {
            font: 24px Georgia, serif !important;
            letter-spacing: 0 !important
        }

        .page {
            height: 100vh;
            min-height: 560px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #26090d
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block
        }

        .music {
            position: fixed;
            z-index: 6;
            right: 20px;
            bottom: 20px;
            border: 1px solid #d6ad62;
            border-radius: 30px;
            background: #2b0b10;
            color: #f5dfae;
            padding: 12px 16px;
            cursor: pointer
        }

        @media(max-width:650px) {
            .nav {
                padding: 14px 16px
            }

            .nav a {
                margin-left: 10px;
                font-size: 9px
            }

            .page {
                height: auto;
                min-height: 100svh
            }

            .page img {
                height: auto;
                object-fit: contain
            }

            .music {
                right: 12px;
                bottom: 12px
            }
        }

        .seal {
            width: 140px;
            height: 140px;
            border: 1px solid var(--gold);
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin: 0 auto 24px;
            margin-top: 15px;
            position: relative;
            color: var(--gold2);
            font-family: "Cormorant Garamond", serif;
            font-size: 40px;
            cursor: pointer;
            background: rgba(216, 182, 109, .05);
            box-shadow: 0 0 0 7px rgba(216, 182, 109, .06), 0 0 45px rgba(216, 182, 109, .12);
    </style>
</head>

<body>
    <div class="opening" id="opening">
        <div class="opening-inner">
            <div class="date" style="color:#d6ad62;">SYED'S FAMILY INVITES YOU TO </div>
            <h1>Nikah Ceremony<br><span style="color:#d6ad62;font-style:italic;">of </span> <span class="seal">S &amp; A
                </span></h1>
            <div class="date"> </div><button class="open-btn" id="openInvitation">Open Invitation&nbsp; ↗</button>
        </div>
    </div>
    <header class="nav"><a class="brand" href="#p1">S & A</a>
        <div><a href="#p3">The day</a><a href="#p2">Our gathering</a><a href="#p4">The place</a></div>
    </header>
    <main>
        <section class="page" id="p1"><img src="pages/1.jpg" alt="Wedding invitation welcome page"></section>
        <section class="page" id="p2"><img src="pages/2.jpg" alt="A note from the couple"></section>
        <section class="page" id="p3"><img src="pages/3.jpg" alt="Wedding date and time details">
        </section>
        <section class="page" id="p4"><img src="pages/4.jpg" alt="Fort Grand venue details"></section>
        <section class="page" id="p5"><img src="pages/5.jpg" alt="Wedding invitation closing page"></section>
    </main>
    <audio id="music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio><button class="music" id="toggle">♫ Play music</button>
    <script>
const cover = document.getElementById('opening');
const a = document.getElementById('music');
const b = document.getElementById('toggle');

let on = false;

async function startMusic() {
    try {
        await a.play();
        on = true;
        b.textContent = '♫ Pause music';
    } catch (error) {
        console.log('Music could not start', error);
    }
}

// OPEN INVITATION BUTTON
document.getElementById('openInvitation').addEventListener('click', async () => {
    cover.classList.add('hidden');
    document.getElementById('p1').scrollIntoView({
        behavior: 'smooth'
    });

    await startMusic();
});

b.addEventListener('click', async () => {
    if (!on) {
        await startMusic();
    } else {
        a.pause();
        on = false;
        b.textContent = '♫ Play music';
    }
});
</script>
</body>

</html>
